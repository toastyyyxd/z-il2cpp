name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: format
        run: nix develop --command zig fmt --check build.zig src tests tools

      - name: test
        run: nix develop --command zig build test

      - name: build
        run: nix develop --command zig build

      - name: shared artifacts
        run: nix develop --command zig build shared

      - name: android artifact
        run: nix develop --command zig build android

      - name: upload shared artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shared
          path: zig-out/shared/
